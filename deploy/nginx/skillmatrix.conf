# Ejemplo de proxy inverso con HTTPS delante de SkillMatrix.
# La aplicación escucha en 127.0.0.1:5000 (HOST=127.0.0.1 en .env) y COOKIE_SECURE=1.
server {
    listen 80;
    server_name skillmatrix.empresa.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name skillmatrix.empresa.local;

    ssl_certificate     /etc/ssl/certs/skillmatrix.crt;
    ssl_certificate_key /etc/ssl/private/skillmatrix.key;

    client_max_body_size 20m;          # importaciones de Excel

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
